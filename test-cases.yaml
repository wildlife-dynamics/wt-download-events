sql-aggregate:
  name: SQL Aggregate Accidents by Day
  mock_io: true
  params:
    workflow_details:
      name: "Events"
      description: "Aggregate accident events by day."
    time_range:
      since: "2025-12-07T00:00:00Z"
      until: "2025-12-09T23:59:59Z"
    er_client_name:
      data_source:
        name: "mep_dev"
    get_event_data:
      event_types: []
    filter_events:
      filter_point_coords: []
    sql_query:
      query: >-
        SELECT event_type, DATE(event_time) as event_time, SUM("How many elephants are in the group?") as total_elephants
        FROM df WHERE event_type = "elephant_sigthing_test" GROUP BY DATE(event_time)
    groupers:
      groupers: []
    persist_events:
      filetypes: ["csv"]
      filename_prefix: "accidents_daily"
    download_all_attachments:
      value: false
    # maps NOT skipped — they render off the pre-SQL split data, proving SQL is
    # download-only (the GROUP BY aggregation lands only in the persisted files).
    base_map_defs:
      base_maps:
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
          opacity: 1.0

