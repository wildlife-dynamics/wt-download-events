sql-vs-map:
  name: SQL Download-Only vs Map
  mock_io: true
  params:
    workflow_details:
      name: "Events"
      description: "SQL drops tooltip/colormap columns from downloads; maps still render."
    time_range:
      since: "2025-12-21T00:00:00Z"
      until: "2025-12-23T23:59:59Z"
    er_client_name:
      data_source:
        name: "mep_dev"
    get_event_data:
      event_types: []
    filter_events:
      filter_point_coords: []
    sql_query:
      # Non-aggregating projection that drops the map's tooltip + colormap columns.
      # Downloads reflect this; maps fork off process_columns (pre-SQL) and are
      # unaffected, proving the query is download-only.
      query: >-
        SELECT serial_number, event_type, event_time, geometry FROM df
    groupers:
      groupers: []
    persist_events:
      filetypes: ["csv"]
      filename_prefix: "events_sql_projection"
    download_all_attachments:
      value: false
    # generate_maps omitted → default true; maps render off the pre-SQL split data.
    base_map_defs:
      base_maps:
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
          opacity: 1.0

sql-explode:
  name: SQL Explode Array Column
  mock_io: true
  # process_events_details is the last io-tagged node in the prep chain, so its
  # mocked example_return seeds the whole pipeline. The fixture carries a
  # `species_observed` JSON-array column for the SQL step to explode.
  mock_io_overrides:
    ecoscope_workflows_ext_custom.tasks.io.process_events_details: dev/fixtures/process-events-details-explode.example-return.parquet
  params:
    workflow_details:
      name: "Events"
      description: "Explode a per-event species array into one row per species."
    time_range:
      since: "2015-01-01T00:00:00Z"
      until: "2015-01-31T23:59:59Z"
    er_client_name:
      data_source:
        name: "mep_dev"
    get_event_data:
      event_types: []
    filter_events:
      filter_point_coords: []
    sql_query:
      # SQLite (pandasql) has no UNNEST; the pinned default-on sanitize turns the
      # `species_observed` array into a JSON string, so json_each() can explode it
      # into one output row per element. SELECT df.* carries every other column
      # (sanitize stringifies the colormap tuple etc.) onto each exploded row.
      # Download-only: maps fork off the pre-SQL split data and are unaffected.
      query: >-
        SELECT df.*, je.value AS species
        FROM df, json_each(df.species_observed) AS je
        ORDER BY df.serial_number, je.id
    groupers:
      groupers: []
    persist_events:
      filetypes: ["csv"]
      filename_prefix: "events_exploded"
    download_all_attachments:
      value: false
    # generate_maps omitted → default true; the explode lands only in the download.
    base_map_defs:
      base_maps:
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
          opacity: 1.0