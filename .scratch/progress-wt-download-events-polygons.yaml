phase: modify
status: in_progress
lastUpdated: '2026-05-06'
implNotes: |
  Implementation in develop/polygon-events (off origin/staging). Two iterations:

  Iteration 1 — task in custom-ext (initial PRD layout):
  - Editable paths for both ecoscope (feat/get-events-force-point-geometry)
    and ecoscope-workflow-task-library (feat/filter-by-geometry-type).
  - All 5 mock-io regression cases + new polygon-events case passed.

  Iteration 2 — task moved to ecoscope.platform (current state):
  - filter_by_geometry_type now lives at
    ecoscope/platform/tasks/transformation/_filter_by_geometry_type.py.
  - apply_reloc_coord_filter additionally got polygon-aware bbox INTERSECTION
    filtering (commit 87dd0fc) — was just pass-through in iteration 1.
  - Spec uses editable ecoscope only; ext-custom 0.1.0rc3 from remote channel.
  - Forced explicit pinning of pydeck (==0.0.2 from custom channel), lonboard
    (==0.0.8 from workflows channel), and pyarrow (>=20,<24 conda-forge) to
    work around strict-channel-priority and the ecoscope-platform vs editable-
    ecoscope dep skew. Documented in ecoscope/doc/.../troubleshooting.md.
  - Polygon layer now has stroked white border (get_line_color: white).
  - Confirmed all 6 mock-io cases (base, polygon-events, month-grouper,
    value-grouper, sql-aggregate, skip-maps) still pass after the move.

  Persistent gotchas across both iterations:
  - polygon-events case must override BOTH get_events AND process_events_details
    mock fixtures (both tagged "io" → second one clobbers the first). Fixture
    builder dev/fixtures/build_polygon_fixture.py is re-runnable.
  - Pydantic must be patched to <2.9.0 in the generated workspace pixi.toml
    after every compile (see ecoscope troubleshooting.md).
  - Test runner needs --frozen when ecoscope is path-installed.
  - mixed-geometries-live case deferred (needs MEP_DEV creds + known polygon
    event window).
notes: 'Modification PRD — adds polygon event support to existing wt-download-events workflow. Spec changes are small (~4 task entries + 2 input rewires + 1 partial addition), most effort is in upstream task-library changes.'

setup:
  - name: Confirm task-library channels (custom + platform) point at editable paths or local builds for dev iteration
    status: completed
  - name: Read the PRD and self-assign understanding
    status: completed

tasks:
  - name: Add filter_by_geometry_type custom task in ecoscope-workflow-task-library
    status: done
    type: develop-task
    notes: |
      Signature: filter_by_geometry_type(df: AnyGeoDataFrame, geometry_types: list[str]) -> AnyGeoDataFrame
      Filter to rows where geometry.geom_type in geometry_types. Reset index optional (default false to keep alignment).
      Add to tasks/transformation/ in ecoscope_workflows_ext_custom.
      Implemented at src/ecoscope-workflows-ext-custom/.../tasks/transformation/_filter_by_geometry_type.py
      with 6 unit tests (all 442 in suite pass). Committed as bd1480a on
      branch feat/filter-by-geometry-type (based on wt-release-candidate) in
      ecoscope-workflow-task-library. Empty geometry_types -> empty result
      (literal filter semantics, not pass-through).

  - name: Modify get_events platform task to expose force_point_geometry
    status: done
    type: develop-task
    notes: |
      File: ecoscope/platform/tasks/io/_earthranger.py:576
      Add force_point_geometry: bool = True kwarg with appropriate Annotated/Field metadata (Advanced, hidden by default in form via SkipJsonSchema if appropriate).
      Pass through to client.get_events(force_point_geometry=force_point_geometry).
      Default True is backwards-compatible.
      Implemented as ForcePointGeometryAnnotation (AdvancedField, default True) +
      kwarg appended to get_events signature, forwarded to client.get_events.
      3 unit tests added (parametrized True/False forwarding + default-True lock-in).
      Committed as bb846c7 + 3f0ac3b on branch feat/get-events-force-point-geometry
      in wildlife-dynamics/ecoscope. PR: #684, issue: #683.

  - name: Modify apply_reloc_coord_filter to be polygon-safe
    status: done
    type: develop-task
    notes: |
      File: ecoscope/platform/tasks/transformation/_filtering.py:30
      In envelope_reloc_filter, add early return True for non-Point geometries:
          if geometry.geom_type != "Point":
              return True
      Place after the existing `if geometry is None` guard.
      No change to ROI intersect logic — polygons can already use roi_gdf.intersects.
      Implemented exactly as specified, immediately after the null-geometry guard.
      1 unit test added (test_filter_passes_through_non_point_geometry — Polygon
      survives both BoundingBox and filter_point_coords). Committed as 9c355b3 +
      391a998 on the same branch (feat/get-events-force-point-geometry), bundled
      into PR #684.

  - name: Wire polygon support into spec.yaml
    status: completed
    type: implement
    notes: |
      Changes to ~/MEP/wt-workflows/wt-download-events/spec.yaml:
      1. get_event_data.partial: add `force_point_geometry: false`
      2. In Generate Maps task-group, after rename_display_columns, insert:
         - filter_points_for_map (filter_by_geometry_type, ["Point"])
         - filter_polygons_for_map (filter_by_geometry_type, ["Polygon", "MultiPolygon"])
         - grouped_events_polygon_layer (create_polygon_layer)
         - combined_event_map_layers (groupbykey, unpack_depth: 1)
      3. Rewire grouped_events_map_layer.mapvalues.argvalues -> filter_points_for_map.return
      4. Rewire grouped_events_ecomap.mapvalues.argvalues -> combined_event_map_layers.return
      Compile and run all existing test cases (regression).

  - name: Add mock fixture for polygon events
    status: completed
    type: implement
    notes: |
      Create dev/fixtures/get-events-polygon.example-return.parquet with:
      - 2 Polygon events (4 and 5 vertices)
      - 2 Point events (overlapping event_types)
      - 1 row with null geometry
      Match the schema of the existing get-events.example-return.parquet shipped in the platform package.
      Generate with a small Python script (shapely + geopandas) and commit the parquet.

  - name: Add new test cases polygon-events and mixed-geometries-live
    status: partial   # polygon-events done; mixed-geometries-live deferred (see Notes)
    type: implement
    notes: |
      In test-cases.yaml:
        polygon-events:
          mock_io: true
          mock_io_overrides:
            ecoscope.platform.tasks.io.get_events: dev/fixtures/get-events-polygon.example-return.parquet
          params: {... mirror base case structure ...}
        mixed-geometries-live:
          mock_io: false
          params:
            ...
            get_event_data:
              event_types: ["arr_project_boundary"]   # Eden's polygon event type
            time_range:
              since: <TBD — pick a window covering at least one existing arr_project_boundary event>
              until: <TBD>
      To find a valid time_range: query mep_dev for any arr_project_boundary event,
      take its event_time, set since=event_time-1d, until=event_time+1d. If no such
      event exists yet, ask Eden to create a test record first.

      Credentials (live case only) are env vars — never put in test-cases.yaml:
        ECOSCOPE_WORKFLOWS__CONNECTIONS__EARTHRANGER__MEP_DEV__SERVER
        ECOSCOPE_WORKFLOWS__CONNECTIONS__EARTHRANGER__MEP_DEV__USERNAME
        ECOSCOPE_WORKFLOWS__CONNECTIONS__EARTHRANGER__MEP_DEV__PASSWORD
        (or ..._TOKEN for token auth)
      Put them in a local .env (gitignored) or export in the shell.

      Run: ./dev/run-test-cases.sh --case polygon-events
      Run: ./dev/run-test-cases.sh --case mixed-geometries-live
      Run: ./dev/run-test-cases.sh --all (regression — all existing cases must still pass)

  - name: Update persist_events filetypes description with WKT note
    status: completed
    type: configure
    notes: |
      In spec.yaml rjsf-overrides.properties, add:
        persist_events.properties.filetypes.description: >-
          Output filetypes for the events dataset. Parquet preserves all geometry types
          natively (recommended for polygon events). CSV writes the geometry column as
          Well-Known Text (WKT) — readable but not directly round-trippable into all GIS tools.
      Recompile and verify at config-form-playground.

